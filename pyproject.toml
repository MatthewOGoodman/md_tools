[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-tools"
version = "1.0.0"
description = "Whole-section operations on Markdown files: list, read, insert, replace, move, extract, reshape, delete — by heading path, fence-aware, lock-serialized, atomic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "markdown-parser-py>=1.0.1",
    "regex>=2024.4.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
md_tools = "md_tools:main"

[tool.setuptools]
py-modules = ["md_tools", "md_tools_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
